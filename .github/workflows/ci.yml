name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: anymail-ci-only
          POSTGRES_DB: anymail_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:anymail-ci-only@127.0.0.1:5432/anymail_test
      - run: npm run build
      - run: npm run format:check
      - run: npm audit --omit=dev --audit-level=high
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r tests/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node tests/oidc-realm.mjs
      - run: >-
          docker run -d --name anymail-connect-ci-keycloak --memory=1g --user=0
          -p 127.0.0.1:4391:8080
          -v "$PWD/.artifacts/oidc:/opt/keycloak/data/import:ro"
          quay.io/keycloak/keycloak@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
          start-dev --hostname=http://localhost:4391 --import-realm
      - run: npm run test:oidc
      - if: always()
        run: docker rm -f anymail-connect-ci-keycloak || true
