services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: anymail
      POSTGRES_DB: anymail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database password}
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anymail -d anymail"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: .
    image: anymail-connect:local
    env_file: .env
    environment:
      DATABASE_URL: postgresql://anymail:${POSTGRES_PASSWORD}@db:5432/anymail
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 2m
    security_opt: ["no-new-privileges:true"]
  worker:
    image: anymail-connect:local
    env_file: .env
    environment:
      DATABASE_URL: postgresql://anymail:${POSTGRES_PASSWORD}@db:5432/anymail
    command: ["node", "dist/src/worker-main.js"]
    depends_on:
      db: { condition: service_healthy }
      api: { condition: service_started }
    restart: unless-stopped
    stop_grace_period: 2m
    security_opt: ["no-new-privileges:true"]
volumes:
  database:
